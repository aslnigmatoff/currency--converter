<script>
  document.addEventListener('DOMContentLoaded', function () {
    const convertBtn = document.getElementById('convertBtn');
    const reverseBtn = document.getElementById('reverseBtn');
    const amountInput = document.getElementById('amount');
    const fromSelect = document.getElementById('from');
    const toSelect = document.getElementById('to');
    const resultDiv = document.getElementById('result');

    const API_URL = 'https://open.er-api.com/v6/latest';

    async function convertCurrency() {
      const amount = parseFloat(amountInput.value);
      const from = fromSelect.value;
      const to = toSelect.value;

      if (isNaN(amount) || amount <= 0) {
        showResult('Введите корректную сумму (больше 0)', 'error');
        return;
      }

      if (from === to) {
        showResult(`${amount} ${from} = ${amount} ${to}<br><small>Курс: 1 ${from} = 1 ${to}</small>`, 'success');
        return;
      }

      convertBtn.disabled = true;
      showResult('<span class="loading"></span> Получаем курс...', '');

      try {
        const response = await fetch(`${API_URL}/${from}?_=${Date.now()}`);
        if (!response.ok) {
          throw new Error('Ошибка сервера: ' + response.status);
        }

        const data = await response.json();

        if (data.result !== 'success' || !data.rates[to]) {
          throw new Error('Курс для выбранных валют не найден');
        }

        const rate = data.rates[to];
        const convertedAmount = (amount * rate).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        showResult(
          `${amount} ${from} = ${convertedAmount} ${to}<br>
          <small>Курс: 1 ${from} = ${rate.toFixed(6)} ${to}<br>
          Обновлено: ${data.time_last_update_utc}</small>`,
          'success'
        );
      } catch (error) {
        console.error('Ошибка конвертации:', error);
        showResult(
          `Ошибка: ${error.message || 'Не удалось получить курс'}<br><small>Попробуйте позже</small>`,
          'error'
        );
      } finally {
        convertBtn.disabled = false;
      }
    }

    function swapCurrencies() {
      const fromValue = fromSelect.value;
      const toValue = toSelect.value;

      fromSelect.value = toValue;
      toSelect.value = fromValue;

      if (amountInput.value && parseFloat(amountInput.value) > 0) {
        convertCurrency();
      }
    }

    convertBtn.addEventListener('click', convertCurrency);
    reverseBtn.addEventListener('click', swapCurrencies);

    function showResult(message, type) {
      resultDiv.innerHTML = message;
      resultDiv.className = type;
    }
  });
</script>
