<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конвертер валют - UZS</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
    .container { background: white; padding: 20px; max-width: 400px; margin: auto; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; }
    select, input { width: 100%; padding: 10px; margin: 10px 0; font-size: 16px; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; }
    .result { margin-top: 15px; text-align: center; font-size: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Конвертер валют</h2>
    <input type="number" id="amount" placeholder="Введите сумму" />
    <select id="from">
      <option value="USD">USD (Доллар)</option>
      <option value="EUR">EUR (Евро)</option>
      <option value="RUB">RUB (Рубль)</option>
      <option value="UZS">UZS (Сум)</option>
    </select>
    <select id="to">
      <option value="UZS">UZS (Сум)</option>
      <option value="USD">USD (Доллар)</option>
      <option value="EUR">EUR (Евро)</option>
      <option value="RUB">RUB (Рубль)</option>
    </select>
    <button onclick="convertCurrency()">Конвертировать</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    async function convertCurrency() {
      const amount = parseFloat(document.getElementById('amount').value);
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;

      if (isNaN(amount)) {
        document.getElementById('result').innerText = 'Введите корректную сумму';
        return;
      }

      try {
        const response = await fetch(`https://api.exchangerate.host/convert?from=${from}&to=${to}&amount=${amount}`);
        const data = await response.json();
        const result = data.result;
        document.getElementById('result').innerText = `${amount} ${from} = ${result.toFixed(2)} ${to}`;
      } catch (error) {
        document.getElementById('result').innerText = 'Ошибка при получении курса';
      }
    }
  </script>
</body>
</html>
