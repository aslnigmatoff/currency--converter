<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Конвертер валют</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }
    input, select, button {
      font-size: 1.2em;
      margin: 10px;
      padding: 10px;
      width: 300px;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
    }
    #swap {
      background-color: #ddd;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Конвертер валют</h1>
  <input type="number" id="amount" placeholder="Введите сумму" />
  <select id="from">
    <option value="USD">USD (Доллар)</option>
    <option value="EUR">EUR (Евро)</option>
    <option value="UZS">UZS (Сум)</option>
    <option value="CNY">CNY (Юань)</option>
  </select>
  <select id="to">
    <option value="USD">USD (Доллар)</option>
    <option value="EUR">EUR (Евро)</option>
    <option value="UZS">UZS (Сум)</option>
    <option value="CNY">CNY (Юань)</option>
  </select>
  <button id="swap" onclick="swapCurrencies()">⇅ Поменять местами</button>
  <button onclick="convert()">Конвертировать</button>
  <div id="result"></div>

  <script>
    function swapCurrencies() {
      const from = document.getElementById("from");
      const to = document.getElementById("to");
      const temp = from.value;
      from.value = to.value;
      to.value = temp;
    }

    async function convert() {
      const amount = document.getElementById("amount").value;
      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;
      const resultDiv = document.getElementById("result");

      const proxy = "https://corsproxy.io/?";
      const apiUrl = `https://api.exchangerate.host/convert?from=${from}&to=${to}&amount=${amount}`;
      const fullUrl = proxy + encodeURIComponent(apiUrl);

      try {
        const response = await fetch(fullUrl);
        const data = await response.json();

        if (data.result !== undefined) {
          resultDiv.innerText = `${amount} ${from} = ${data.result.toFixed(2)} ${to}`;
        } else {
          resultDiv.innerText = "Ошибка при получении курса.";
        }
      } catch (error) {
        resultDiv.innerText = "Ошибка при подключении к API.";
      }
    }
  </script>
</body>
</html>
