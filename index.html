
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Конвертер валют</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .converter {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 1rem;
    }
    #result {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="converter">
    <h2>Конвертер валют</h2>
    <input type="number" id="amount" placeholder="Введите сумму" />
    <select id="fromCurrency">
      <option value="USD">USD (Доллар)</option>
      <option value="UZS">UZS (Сум)</option>
      <option value="CNY">CNY (Юань)</option>
    </select>
    <select id="toCurrency">
      <option value="UZS">UZS (Сум)</option>
      <option value="USD">USD (Доллар)</option>
      <option value="CNY">CNY (Юань)</option>
    </select>
    <button onclick="convert()">Конвертировать</button>
    <div id="result"></div>
  </div>

  <script>
    async function convert() {
      const amount = document.getElementById("amount").value;
      const from = document.getElementById("fromCurrency").value;
      const to = document.getElementById("toCurrency").value;
      const resultDiv = document.getElementById("result");

      try {
        const res = await fetch(`https://api.exchangerate.host/latest?base=${from}&symbols=${to}`);
        const data = await res.json();

        if (!data || !data.rates[to]) {
          resultDiv.innerText = "Ошибка при получении курса";
          return;
        }

        const rate = data.rates[to];
        const converted = (amount * rate).toFixed(2);
        resultDiv.innerText = `${amount} ${from} = ${converted} ${to}`;
      } catch (error) {
        resultDiv.innerText = "Ошибка при получении курса";
      }
    }
  </script>
</body>
</html>
