<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Улучшенный конвертер валют</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
      max-width: 800px;
      margin: 0 auto;
    }
    .converter-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .input-group {
      display: flex;
      align-items: center;
      margin: 10px 0;
      width: 100%;
      justify-content: center;
    }
    input, select, button {
      font-size: 1.2em;
      padding: 10px;
      margin: 5px;
    }
    input {
      width: 200px;
    }
    select {
      width: 150px;
    }
    button {
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #45a049;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #swap-btn {
      background-color: #2196F3;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 1.5em;
    }
    #swap-btn:hover {
      background-color: #0b7dda;
    }
    #result {
      margin: 20px 0;
      font-weight: bold;
      font-size: 1.3em;
      min-height: 30px;
    }
    #loader {
      display: none;
      margin: 10px;
    }
    #history {
      width: 100%;
      margin-top: 30px;
      border-top: 1px solid #ddd;
      padding-top: 20px;
    }
    .history-item {
      padding: 8px;
      border-bottom: 1px solid #eee;
    }
    .chart-container {
      width: 100%;
      height: 300px;
      margin-top: 30px;
    }
    #clear-history {
      background-color: #f44336;
      margin-top: 10px;
    }
    #clear-history:hover {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>
  <h1>Улучшенный конвертер валют</h1>
  
  <div class="converter-container">
    <div class="input-group">
      <input type="number" id="amount" placeholder="Сумма" min="0.01" step="0.01" />
    </div>
    
    <div class="input-group">
      <select id="from">
        <option value="USD">USD (Доллар)</option>
        <option value="EUR">EUR (Евро)</option>
        <option value="UZS">UZS (Сум)</option>
        <option value="CNY">CNY (Юань)</option>
      </select>
      
      <button id="swap-btn" onclick="swapCurrencies()">↔️</button>
      
      <select id="to">
        <option value="EUR">EUR (Евро)</option>
        <option value="USD">USD (Доллар)</option>
        <option value="UZS">UZS (Сум)</option>
        <option value="CNY">CNY (Юань)</option>
      </select>
    </div>
    
    <button onclick="convert()" id="convertBtn">Конвертировать</button>
    
    <div id="loader">Загрузка...</div>
    <div id="result"></div>
  </div>
  
  <div class="chart-container">
    <canvas id="rateChart"></canvas>
  </div>
  
  <div id="history">
    <h2>История конвертаций</h2>
    <div id="history-list"></div>
    <button id="clear-history" onclick="clearHistory()">Очистить историю</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Глобальные переменные
    let rateChart = null;
    const MAX_HISTORY_ITEMS = 10;
    
    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', () => {
      loadHistory();
      loadExchangeRates();
    });
    
    // Основная функция конвертации
    async function convert() {
      const amount = parseFloat(document.getElementById("amount").value);
      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;
      const resultDiv = document.getElementById("result");
      const button = document.getElementById("convertBtn");
      const loader = document.getElementById("loader");
      
      // Валидация ввода
      if (isNaN(amount) || amount <= 0) {
        resultDiv.innerText = "Введите положительное число!";
        return;
      }
      
      button.disabled = true;
      loader.style.display = "block";
      resultDiv.innerText = "";
      
      try {
        const cacheKey = `rate_${from}_${to}`;
        const cachedRate = localStorage.getItem(cacheKey);
        
        // Используем кэшированный курс, если он есть и не старше 1 часа
        if (cachedRate) {
          const cachedData = JSON.parse(cachedRate);
          if (Date.now() - cachedData.timestamp < 3600000) {
            const result = amount * cachedData.rate;
            showResult(amount, from, result.toFixed(2), to);
            return;
          }
        }
        
        // Получаем свежий курс
        const response = await fetch(`https://api.exchangerate.host/convert?from=${from}&to=${to}&amount=${amount}`);
        const data = await response.json();
        
        if (data.result !== undefined) {
          showResult(amount, from, data.result.toFixed(2), to);
          // Сохраняем в кэш
          localStorage.setItem(cacheKey, JSON.stringify({
            rate: data.result / amount,
            timestamp: Date.now()
          }));
        } else {
          resultDiv.innerText = "Ошибка: курс не получен";
        }
      } catch (error) {
        console.error("Ошибка конвертации:", error);
        resultDiv.innerText = "Ошибка подключения к сервису";
      } finally {
        button.disabled = false;
        loader.style.display = "none";
      }
    }
    
    // Показываем результат и сохраняем в историю
    function showResult(amount, from, result, to) {
      const resultDiv = document.getElementById("result");
      const resultText = `${amount} ${from} = ${result} ${to}`;
      resultDiv.innerText = resultText;
      
      // Добавляем в историю
      addToHistory({
        date: new Date().toLocaleString(),
        from: `${amount} ${from}`,
        to: `${result} ${to}`,
        fromCurrency: from,
        toCurrency: to
      });
      
      // Обновляем график для этих валют
      updateChart(from, to);
    }
    
    // Обмен валют местами
    function swapCurrencies() {
      const from = document.getElementById("from");
      const to = document.getElementById("to");
      const temp = from.value;
      from.value = to.value;
      to.value = temp;
      
      // Если есть сумма, делаем конвертацию
      if (document.getElementById("amount").value) {
        convert();
      }
    }
    
    // Работа с историей
    function addToHistory(conversion) {
      let history = JSON.parse(localStorage.getItem('conversionHistory') || '[]');
      
      // Добавляем новую запись в начало
      history.unshift(conversion);
      
      // Ограничиваем количество записей
      if (history.length > MAX_HISTORY_ITEMS) {
        history = history.slice(0, MAX_HISTORY_ITEMS);
      }
      
      localStorage.setItem('conversionHistory', JSON.stringify(history));
      loadHistory();
    }
    
    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('conversionHistory') || '[]');
      const historyList = document.getElementById("history-list");
      
      historyList.innerHTML = history.length > 0 
        ? history.map(item => `
            <div class="history-item">
              <strong>${item.date}</strong>: ${item.from} → ${item.to}
            </div>
          `).join('')
        : '<div>История конвертаций пуста</div>';
    }
    
    function clearHistory() {
      localStorage.removeItem('conversionHistory');
      loadHistory();
    }
    
    // График курсов
    async function loadExchangeRates() {
      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;
      updateChart(from, to);
    }
    
    async function updateChart(from, to) {
      try {
        // Получаем данные за последние 7 дней
        const endDate = new Date();
        const startDate = new Date();
        startDate.setDate(endDate.getDate() - 7);
        
        const formatDate = (date) => date.toISOString().split('T')[0];
        
        const response = await fetch(
          `https://api.exchangerate.host/timeseries?start_date=${formatDate(startDate)}&end_date=${formatDate(endDate)}&base=${from}&symbols=${to}`
        );
        
        const data = await response.json();
        
        if (data.rates) {
          const dates = Object.keys(data.rates).sort();
          const rates = dates.map(date => data.rates[date][to]);
          
          renderChart(dates, rates, from, to);
        }
      } catch (error) {
        console.error("Ошибка загрузки данных для графика:", error);
      }
    }
    
    function renderChart(labels, data, from, to) {
      const ctx = document.getElementById('rateChart').getContext('2d');
      
      // Удаляем предыдущий график, если он есть
      if (rateChart) {
        rateChart.destroy();
      }
      
      rateChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: `${from} to ${to}`,
            data: data,
            borderColor: 'rgb(75, 192, 192)',
            tension: 0.1,
            fill: false
          }]
        },
        options: {
          responsive: true,
          plugins: {
            title: {
              display: true,
              text: `Динамика курса за последние 7 дней`
            },
          },
          scales: {
            y: {
              beginAtZero: false
            }
          }
        }
      });
    }
  </script>
</body>
</html>
